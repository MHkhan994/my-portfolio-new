name: Deploy Portfolio

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify standalone build
        run: |
          ls -la
          ls -la .next
          ls -la .next/standalone
          ls -la .next/static

      - name: Upload standalone build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}

          source: ".next/standalone/**,.next/static/**,public/**"
          target: "/var/www/portfolio"
          strip_components: 2
          overwrite: true

      - name: Restart application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            mkdir -p /var/www/portfolio/.next

            rm -rf /var/www/portfolio/.next/static
            mv /var/www/portfolio/static /var/www/portfolio/.next/static

            if pm2 describe portfolio > /dev/null; then
              pm2 restart portfolio
            else
              PORT=3003 pm2 start /var/www/portfolio/server.js --name portfolio
            fi

            pm2 save
